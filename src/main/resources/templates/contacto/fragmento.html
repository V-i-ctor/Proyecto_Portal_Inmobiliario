<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout/plantilla :: head}">
        <title>Contáctanos</title>
    </head>
    <body>
        <section th:fragment="contacto" class="container py-5">
            <div class="row">
                <div class="col-md-6 offset-md-3">
                    <h2>Agregar Contacto</h2>
                    <form th:action="@{/contacto/guardar}" th:object="${contacto}"
                          method="POST" class="was-validated" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="nombre">[[#{contacto.nombre}]]</label>
                            <input type="text" class="form-control" name="nombre" required="true"/>
                        </div>
                        <div class="mb-3">
                            <label for="apellido">[[#{contacto.apellido}]]</label>
                            <input type="text" class="form-control" name="apellido" required="true"/>
                        </div>
                        <div class="mb-3">
                            <label for="correo">[[#{contacto.correo}]]</label>
                            <input type="email" class="form-control" name="correo" required="true"/>
                        </div>
                        <div class="mb-3">
                            <label for="telefono">[[#{contacto.telefono}]]</label>
                            <input type="text" class="form-control" name="telefono" required="true"/>
                        </div>
                        <div class="mb-3">
                            <label for="mensaje">[[#{contacto.mensaje}]]</label>
                            <textarea class="form-control" name="mensajeContacto" rows="4" required="true"></textarea>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" name="activo" id="activo"/>
                            <label class="form-check-label" for="activo">[[#{contacto.activo}]]</label>
                        </div>
                        <button class="btn btn-primary" type="submit">Guardar</button>
                    </form>
                </div>
            </div>
        </section>
        <!-- 1 Fragmento para agregar contacto, es la ventana modal -->

        <section th:fragment="agregarContacto">
            <div id="agregarContacto" 
                 class="modal fade" 
                 tabindex="-1" 
                 aria-labelledby="exampleModalLabel" 
                 aria-hidden="true"
                 style="display: block;"> 
                <div class="modal-dialog modal-md">
                    <div class="modal-content">
                        <div class="modal-header bg-info text-white">
                            <h5 class="modal-title">[[#{contacto.agregar}]]</h5>
                        </div> 
                        <form th:action="@{/contacto/guardar}" th:object="${contacto}"
                              method="POST" class="was-validated" enctype="multipart/form-data">
                            <div class="modal-body">
                                <div class="mb-3">
                                    <label for="nombre">[[#{contacto.nombre}]]</label>
                                    <input type="text" class="form-control" name="nombre" required="true"/>
                                </div>
                                <div class="mb-3">
                                    <label for="apellido">[[#{contacto.apellido}]]</label>
                                    <input type="text" class="form-control" name="apellido" required="true"/>
                                </div>
                                <div class="mb-3">
                                    <label for="correo">[[#{contacto.correo}]]</label>
                                    <input type="text" class="form-control" name="correo" required="true"/>
                                </div>
                                <div class="mb-3">
                                    <label for="telefono">[[#{contacto.telefono}]]</label>
                                    <input type="text" class="form-control" name="telefono" required="true"/>
                                </div>
                                <div class="mb-3">
                                    <label for="mensaje">[[#{contacto.mensaje}]]</label>
                                    <input type="text" class="form-control" name="mensaje" required="true"/>
                                </div>
                                <div class="mb-3">
                                    <label for="activo">[[#{contacto.activo}]]</label>
                                    <input class="form-check-input" type="checkbox" name="activo" id="activo"/>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button class="btn btn-primary" type="submit">Guardar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <!-- 2 Fragmento que se utiliza en la página modifca.html -->
        <section th:fragment="editarContacto">
            <div class="row">
                <div class="col-md-2"></div>
                <div class="col-md-8">
                    <form method="POST"
                          th:action="@{/contacto/guardar}" 
                          th:object="${contacto}"
                          class="was-validated"                          
                          enctype="multipart/form-data">
                        <input type="hidden" name="idContacto" th:field="*{idContacto}"/>
                        <section th:replace="~{contacto/fragmento :: botonesEditar}"/>
                        <div id=details>
                            <div class="container">
                                <div class="row">
                                    <div class="col">
                                        <div class="card">
                                            <div class="card-header">
                                                <h4>[[#{accion.actualizar}]]</h4>
                                            </div>
                                            <div class="card-body">
                                                <div class="mb-3">
                                                    <label for="nombre">[[#{contacto.nombre}]]</label>
                                                    <input type="text" class="form-control" 
                                                           name="nombre" th:field="*{nombre}"
                                                           required="true">
                                                </div>
                                                <div class="mb-3">
                                                    <label for="apellido">[[#{contacto.apellido}]]</label>
                                                    <input type="text" class="form-control" 
                                                           name="apellido" th:field="*{apellido}"
                                                           required="true">
                                                </div>
                                                <div class="mb-3">
                                                    <label for="correo">[[#{contacto.correo}]]</label>
                                                    <input type="text" class="form-control" 
                                                           name="correo" th:field="*{correo}"
                                                           required="true">
                                                </div>
                                                <div class="mb-3">
                                                    <label for="telefono">[[#{contacto.telefono}]]</label>
                                                    <input type="text" class="form-control" 
                                                           name="telefono" th:field="*{telefono}"
                                                           required="true">
                                                </div>
                                                <div class="mb-3">
                                                    <label for="mensaje">[[#{contacto.mensaje}]]</label>
                                                    <input type="text" class="form-control" 
                                                           name="mensaje" th:field="*{mensaje}"
                                                           required="true">
                                                </div>
                                                <div class="mb-3">
                                                    <label for="activo">[[#{contacto.activo}]]</label>
                                                    <input class="form-check-input" 
                                                           type="checkbox" 
                                                           name="activo" 
                                                           id="activo"
                                                           th:field="*{activo}">
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                    </form>
                </div>
            </div>
        </section>

        <!-- 3 Fragmento que se utiliza en el fragmento anterior -->
        <section th:fragment="botonesEditar">
            <div class="container py-4 mb-4 bg-light">
                <div class="row">
                    <div class="col-md-4 d-grid">
                        <a th:href="@{/contacto/listado}" class="btn btn-primary">
                            <i class="fas fa-arrow-left"></i> [[#{accion.regresar}]]
                        </a>
                    </div>
                    <div class="col-md-4 d-grid">                                
                        <a th:href="@{/contacto/eliminar/}+${contacto.idContacto}"
                           class="btn btn-danger">
                            <i class="fas fa-trash"></i> [[#{accion.eliminar}]]
                        </a>
                    </div>
                    <div class="col-md-4 d-grid">
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-check"></i> [[#{accion.guardar}]]
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </body>
</html>
